<svg viewBox="0 0 680 340" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Electron IPC 通信流程</title>
  <desc>Electron 渲染进程通过 Preload 桥梁与主进程通信的完整数据流</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 2 1 L 8 5 L 2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .t  { font: 500 15px system-ui, sans-serif; fill: #E1E1E1; }
    .ts { font: 400 12px system-ui, sans-serif; fill: #888; }
    .tb { font: 500 13px system-ui, sans-serif; }
    .tx { font: 400 11px system-ui, sans-serif; }
    .tm { font-family: 'Cascadia Code', Consolas, monospace; font-size: 11px; }
  </style>

  <rect width="680" height="340" fill="#1a1a2e" rx="0"/>

  <text class="t" x="340" y="28" text-anchor="middle">Electron IPC 通信流程</text>
  <text class="ts" x="340" y="46" text-anchor="middle">contextIsolation: true 下的安全通信模型</text>

  <line x1="60" y1="58" x2="620" y2="58" stroke="#444" stroke-width="0.5"/>

  <rect x="20" y="72" width="185" height="112" rx="10" fill="#0C447C" fill-opacity="0.85" stroke="#378ADD" stroke-width="0.5"/>
  <text class="tb" x="112" y="94" text-anchor="middle" fill="#B5D4F4">渲染进程</text>
  <text class="tx" x="112" y="112" text-anchor="middle" fill="#85B7EB">Vue 3 · Chromium</text>
  <line x1="38" y1="120" x2="187" y2="120" stroke="#378ADD" stroke-width="0.5" stroke-opacity="0.3"/>
  <text class="tm" x="112" y="138" text-anchor="middle" fill="#9FE1CB">window.electronAPI</text>
  <text class="tm" x="112" y="156" text-anchor="middle" fill="#5DCAA5"> .openFile()</text>
  <text class="tx" x="112" y="176" text-anchor="middle" fill="#85B7EB">await 异步等待结果</text>

  <rect x="245" y="72" width="190" height="112" rx="10" fill="#3C3489" fill-opacity="0.85" stroke="#7F77DD" stroke-width="0.5"/>
  <text class="tb" x="340" y="94" text-anchor="middle" fill="#CECBF6">Preload 脚本</text>
  <text class="tx" x="340" y="112" text-anchor="middle" fill="#AFA9EC">安全桥梁 · 双向转接</text>
  <line x1="263" y1="120" x2="417" y2="120" stroke="#7F77DD" stroke-width="0.5" stroke-opacity="0.3"/>
  <text class="tm" x="340" y="138" text-anchor="middle" fill="#CECBF6">contextBridge</text>
  <text class="tm" x="340" y="156" text-anchor="middle" fill="#CECBF6">exposeInMainWorld()</text>
  <text class="tx" x="340" y="176" text-anchor="middle" fill="#AFA9EC">ipcRenderer.invoke / on</text>

  <rect x="475" y="72" width="185" height="112" rx="10" fill="#085041" fill-opacity="0.85" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="tb" x="567" y="94" text-anchor="middle" fill="#9FE1CB">主进程</text>
  <text class="tx" x="567" y="112" text-anchor="middle" fill="#5DCAA5">Node.js · 系统级权限</text>
  <line x1="493" y1="120" x2="642" y2="120" stroke="#1D9E75" stroke-width="0.5" stroke-opacity="0.3"/>
  <text class="tm" x="567" y="138" text-anchor="middle" fill="#9FE1CB">ipcMain.handle()</text>
  <text class="tx" x="567" y="156" text-anchor="middle" fill="#9FE1CB">dialog / fs / 处理</text>
  <text class="tx" x="567" y="176" text-anchor="middle" fill="#5DCAA5">return 返回数据</text>

  <line x1="205" y1="128" x2="237" y2="128" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="tx" x="221" y="120" text-anchor="middle" fill="#85B7EB">invoke</text>

  <line x1="435" y1="128" x2="467" y2="128" stroke="#AFA9EC" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="tx" x="451" y="120" text-anchor="middle" fill="#AFA9EC">handle</text>

  <line x1="467" y1="155" x2="435" y2="155" stroke="#5DCAA5" stroke-width="1" marker-end="url(#a)"/>
  <text class="tx" x="451" y="168" text-anchor="middle" fill="#5DCAA5">return</text>

  <line x1="237" y1="155" x2="205" y2="155" stroke="#5DCAA5" stroke-width="1" marker-end="url(#a)"/>
  <text class="tx" x="221" y="168" text-anchor="middle" fill="#5DCAA5">resolve</text>

  <rect x="298" y="198" width="84" height="22" rx="4" fill="#26215C" fill-opacity="0.7" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="tm" x="340" y="213" text-anchor="middle" fill="#CECBF6" font-size="10px">dialog:openFile</text>
  <text class="tx" x="340" y="242" text-anchor="middle" fill="#888">IPC 通道名 · 两端握手的通信协议</text>

  <rect x="28" y="268" width="168" height="24" rx="6" fill="#A32D2D" fill-opacity="0.15" stroke="#E24B4A" stroke-width="0.5" stroke-opacity="0.35"/>
  <text class="tx" x="112" y="285" text-anchor="middle" fill="#F09595">contextIsolation · 无 Node 权限</text>

  <rect x="484" y="268" width="168" height="24" rx="6" fill="#0F6E56" fill-opacity="0.15" stroke="#1D9E75" stroke-width="0.5" stroke-opacity="0.35"/>
  <text class="tx" x="568" y="285" text-anchor="middle" fill="#5DCAA5">系统级能力 · 文件 / 进程 / 网络</text>

  <text class="tx" x="340" y="316" text-anchor="middle" fill="#666">nodeIntegration: false  ·  contextIsolation: true  ·  sandbox: true</text>

  <circle cx="221" cy="119" r="7.5" fill="#534AB7" fill-opacity="0.8" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="221" y="123" text-anchor="middle" font-size="9px" font-weight="500" fill="#CECBF6" font-family="system-ui, sans-serif">1</text>

  <circle cx="451" cy="119" r="7.5" fill="#534AB7" fill-opacity="0.8" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="451" y="123" text-anchor="middle" font-size="9px" font-weight="500" fill="#CECBF6" font-family="system-ui, sans-serif">2</text>

  <circle cx="451" cy="169" r="7.5" fill="#534AB7" fill-opacity="0.8" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="451" y="173" text-anchor="middle" font-size="9px" font-weight="500" fill="#CECBF6" font-family="system-ui, sans-serif">3</text>

  <circle cx="221" cy="169" r="7.5" fill="#534AB7" fill-opacity="0.8" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="221" y="173" text-anchor="middle" font-size="9px" font-weight="500" fill="#CECBF6" font-family="system-ui, sans-serif">4</text>

</svg>
